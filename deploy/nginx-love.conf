server {
    listen 80;
    server_name love.vlesnix.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name love.vlesnix.site;

    # certbot will inject ssl_certificate paths
    # ssl_certificate /etc/letsencrypt/live/love.vlesnix.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/love.vlesnix.site/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/State-Love-Admin/frontend/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
